<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="lp_meta_title">صفحة هبوط مخصصة | حسن سرحان - HSSN-SRHAN</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Readex+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .lp-page-wrapper {
            background-color: #070D1E;
            color: #F8FAFC;
            font-family: 'Cairo', 'Readex Pro', sans-serif;
            line-height: 1.8;
            min-height: 100vh;
        }

        .lp-hero-section {
            background: linear-gradient(135deg, #0B132B 0%, #162447 60%, #070D1E 100%);
            padding: 5rem 1.5rem;
            text-align: center;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            position: relative;
            overflow: hidden;
        }

        .lp-badge {
            display: inline-block;
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid rgba(212, 175, 55, 0.4);
            color: #D4AF37;
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
        }

        .lp-hero-title {
            font-size: 2.6rem !important;
            font-weight: 900 !important;
            color: #FFFFFF !important;
            line-height: 1.3 !important;
            margin-bottom: 1.2rem;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }

        .lp-hero-subtitle {
            font-size: 1.15rem;
            color: #CBD5E1;
            max-width: 780px;
            margin: 0 auto 2rem auto;
        }

        .lp-cta-group {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .lp-btn-primary {
            background: linear-gradient(135deg, #D4AF37 0%, #B48811 100%);
            color: #0B132B !important;
            font-weight: 900;
            font-size: 1.05rem;
            padding: 14px 32px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.3);
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: none;
            cursor: pointer;
            text-decoration: none;
        }

        .lp-btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 30px rgba(212, 175, 55, 0.45);
        }

        .lp-btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #FFFFFF !important;
            font-weight: 800;
            font-size: 1rem;
            padding: 14px 28px;
            border-radius: 12px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .lp-trust-note {
            font-size: 0.88rem;
            color: #94A3B8;
            font-weight: 700;
        }

        .lp-section {
            padding: 4.5rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .lp-section-title {
            font-size: 2rem !important;
            font-weight: 900 !important;
            color: #FFFFFF !important;
            text-align: center;
            margin-bottom: 0.6rem;
        }

        .lp-section-subtitle {
            font-size: 1rem;
            color: #94A3B8;
            text-align: center;
            max-width: 680px;
            margin: 0 auto 3rem auto;
        }

        .lp-grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .lp-grid-4 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
        }

        .lp-card {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.8rem;
            transition: all 0.3s ease;
        }

        .lp-card:hover {
            border-color: rgba(212, 175, 55, 0.4);
            transform: translateY(-4px);
        }

        .lp-card-problem { background: rgba(239, 68, 68, 0.05); border-color: rgba(239, 68, 68, 0.2); }
        .lp-card-solution { background: rgba(34, 197, 94, 0.05); border-color: rgba(34, 197, 94, 0.2); }

        .lp-icon-box { font-size: 2.2rem; margin-bottom: 1rem; }
        .lp-card-title {
            font-size: 1.2rem !important;
            font-weight: 800 !important;
            color: #FFFFFF !important;
            margin-bottom: 0.6rem;
            white-space: normal !important;
            overflow: visible !important;
        }
        .lp-card-desc { font-size: 0.95rem; color: #94A3B8; line-height: 1.6; }

        .lp-step-num {
            display: inline-block;
            background: linear-gradient(135deg, #D4AF37, #B48811);
            color: #0B132B;
            font-weight: 900;
            font-size: 1rem;
            padding: 4px 12px;
            border-radius: 8px;
            margin-bottom: 0.8rem;
        }

        .lp-stat-box {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            padding: 2rem 1rem;
            text-align: center;
        }

        .lp-stat-number { font-size: 2.4rem; font-weight: 900; color: #D4AF37; margin-bottom: 4px; }
        .lp-stat-label { font-size: 0.92rem; color: #CBD5E1; font-weight: 700; }

        .lp-guarantee-box {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.12) 0%, rgba(15, 23, 42, 0.9) 100%);
            border: 2px solid #D4AF37;
            border-radius: 20px;
            padding: 2.5rem 2rem;
            text-align: center;
            max-width: 850px;
            margin: 0 auto;
        }

        .lp-pricing-card {
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid #D4AF37;
            border-radius: 20px;
            padding: 2.5rem 2rem;
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
            position: relative;
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.15);
        }

        .lp-discount-badge {
            position: absolute;
            top: -15px;
            right: 50%;
            transform: translateX(50%);
            background: #EF4444;
            color: #FFF;
            padding: 4px 16px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 0.85rem;
        }

        .lp-price-amount { font-size: 2.8rem; font-weight: 900; color: #D4AF37; margin: 1rem 0; }
        .lp-price-original { font-size: 1.2rem; color: #64748B; text-decoration: line-through; margin-left: 8px; }

        .lp-feature-list { text-align: right; list-style: none; margin: 1.8rem 0; padding: 0; }
        .lp-feature-list li {
            font-size: 0.98rem;
            color: #E2E8F0;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }
        .lp-feature-list li::before { content: "✓"; color: #4ADE80; font-weight: 900; font-size: 1.1rem; }

        .lp-faq-item {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 1.2rem 1.5rem;
            margin-bottom: 1rem;
        }
        .lp-faq-q { font-weight: 800; font-size: 1.05rem; color: #FFF; margin-bottom: 6px; }
        .lp-faq-a { font-size: 0.95rem; color: #94A3B8; }

        .lp-final-cta-banner {
            background: linear-gradient(135deg, #0B132B, #1E293B);
            border: 1px solid #D4AF37;
            border-radius: 20px;
            padding: 3rem 2rem;
            text-align: center;
            margin-top: 3rem;
        }

        @media (max-width: 768px) {
            .lp-hero-title { font-size: 1.8rem !important; }
            .lp-section-title { font-size: 1.5rem !important; }
            .lp-cta-group { flex-direction: column; width: 100%; }
            .lp-btn-primary, .lp-btn-secondary { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header class="header">
        <div class="container navbar">
            <a href="index.html" class="logo">
                <span class="logo-mark">H</span>
                <span class="logo-text">حسن سرحان <small style="display:block; font-size:0.65rem; color:var(--text-muted); font-weight:700;">HSSN-SRHAN</small></span>
            </a>
            <div class="nav-links">
                <a href="index.html" data-en="Home">الرئيسية</a>
                <a href="portfolio.html" data-en="Portfolio">الأعمال</a>
                <a href="services.html" data-en="Services">الخدمات</a>
                <a href="courses.html" data-en="Courses">الكورسات</a>
                <a href="digital-products.html" data-en="Products">المنتجات</a>
                <a href="contact.html" class="btn-primary" data-en="Book Consultation 📅">احجز استشارة 📅</a>
            </div>
        </div>
    </header>

    <div class="lp-page-wrapper">
        <div class="container" style="padding-top: 1rem;" id="lp_blocks_container">
            <!-- Populated via JavaScript -->
        </div>
    </div>

    <!-- Footer -->
    <footer style="background:#0B132B; border-top:1px solid rgba(255,255,255,0.1); padding:2rem 0; text-align:center; color:#94A3B8; font-size:0.9rem;">
        <div class="container">
            <p data-en="All Rights Reserved © HASSAN SARHAN">جميع الحقوق محفوظة © حسن سرحان</p>
        </div>
    </footer>

    <script src="assets/js/site-data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('slug') || 'enterprise-growth';

            const lps = getMasterData('landing_pages') || [];
            let lp = lps.find(l => l.slug === slug) || lps[0];

            if (!lp) {
                document.getElementById('lp_blocks_container').innerHTML = '<div style="text-align:center; padding:5rem 0;"><h2>الصفحة غير موجودة 404</h2></div>';
                return;
            }

            document.getElementById('lp_meta_title').innerText = lp.title_ar + ' | حسن سرحان';

            let blocks = [];
            try {
                blocks = typeof lp.blocks_json === 'string' ? JSON.parse(lp.blocks_json) : lp.blocks_json;
            } catch(e) {
                blocks = [];
            }

            const container = document.getElementById('lp_blocks_container');
            container.innerHTML = blocks.map(blk => renderBlock(blk)).join('');
        });

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function renderBlock(blk) {
            const type = blk.type || 'hero';

            if (type === 'hero') {
                return `
                    <header class="lp-hero-section">
                        ${blk.badge_ar ? `<div class="lp-badge">${escapeHtml(blk.badge_ar)}</div>` : ''}
                        <h1 class="lp-hero-title">${escapeHtml(blk.title_ar)}</h1>
                        ${blk.subtitle_ar ? `<p class="lp-hero-subtitle">${escapeHtml(blk.subtitle_ar)}</p>` : ''}
                        <div class="lp-cta-group">
                            ${blk.primary_cta_text_ar ? `<a href="${blk.primary_cta_link || '#pricing_section'}" class="lp-btn-primary">${escapeHtml(blk.primary_cta_text_ar)}</a>` : ''}
                            ${blk.secondary_cta_text_ar ? `<a href="${blk.secondary_cta_link || 'https://wa.me/966500000000'}" target="_blank" class="lp-btn-secondary">${escapeHtml(blk.secondary_cta_text_ar)}</a>` : ''}
                        </div>
                        ${blk.trust_note_ar ? `<div class="lp-trust-note">${escapeHtml(blk.trust_note_ar)}</div>` : ''}
                    </header>
                `;
            }

            if (type === 'problems') {
                const itemsHtml = (blk.items || []).map(item => `
                    <div class="lp-card lp-card-problem">
                        <div class="lp-icon-box">${escapeHtml(item.icon || '⚠️')}</div>
                        <h3 class="lp-card-title">${escapeHtml(item.title_ar)}</h3>
                        <p class="lp-card-desc">${escapeHtml(item.desc_ar)}</p>
                    </div>
                `).join('');
                return `
                    <section class="lp-section">
                        <h2 class="lp-section-title">${escapeHtml(blk.title_ar || 'تحديات النشاط التسويقي')}</h2>
                        ${blk.subtitle_ar ? `<p class="lp-section-subtitle">${escapeHtml(blk.subtitle_ar)}</p>` : ''}
                        <div class="lp-grid-3">${itemsHtml}</div>
                    </section>
                `;
            }

            if (type === 'solution') {
                const itemsHtml = (blk.items || []).map(item => `
                    <div class="lp-card lp-card-solution">
                        <div class="lp-icon-box">${escapeHtml(item.icon || '🎯')}</div>
                        <h3 class="lp-card-title">${escapeHtml(item.title_ar)}</h3>
                        <p class="lp-card-desc">${escapeHtml(item.desc_ar)}</p>
                    </div>
                `).join('');
                return `
                    <section class="lp-section">
                        <h2 class="lp-section-title">${escapeHtml(blk.title_ar || 'الحل الاستراتيجي')}</h2>
                        ${blk.subtitle_ar ? `<p class="lp-section-subtitle">${escapeHtml(blk.subtitle_ar)}</p>` : ''}
                        <div class="lp-grid-3">${itemsHtml}</div>
                    </section>
                `;
            }

            if (type === 'features') {
                const itemsHtml = (blk.items || []).map(item => `
                    <div class="lp-card">
                        <div class="lp-icon-box">${escapeHtml(item.icon || '⚡')}</div>
                        <h3 class="lp-card-title">${escapeHtml(item.title_ar)}</h3>
                        <p class="lp-card-desc">${escapeHtml(item.desc_ar)}</p>
                    </div>
                `).join('');
                return `
                    <section class="lp-section">
                        <h2 class="lp-section-title">${escapeHtml(blk.title_ar || 'المميزات التنافسية')}</h2>
                        ${blk.subtitle_ar ? `<p class="lp-section-subtitle">${escapeHtml(blk.subtitle_ar)}</p>` : ''}
                        <div class="lp-grid-4">${itemsHtml}</div>
                    </section>
                `;
            }

            if (type === 'process') {
                const stepsHtml = (blk.steps || []).map(step => `
                    <div class="lp-card">
                        <span class="lp-step-num">الخطوة ${escapeHtml(step.num || '01')}</span>
                        <h3 class="lp-card-title">${escapeHtml(step.title_ar)}</h3>
                        <p class="lp-card-desc">${escapeHtml(step.desc_ar)}</p>
                    </div>
                `).join('');
                return `
                    <section class="lp-section">
                        <h2 class="lp-section-title">${escapeHtml(blk.title_ar || 'خطوات آلية العمل')}</h2>
                        ${blk.subtitle_ar ? `<p class="lp-section-subtitle">${escapeHtml(blk.subtitle_ar)}</p>` : ''}
                        <div class="lp-grid-4">${stepsHtml}</div>
                    </section>
                `;
            }

            if (type === 'case_studies') {
                const statsHtml = (blk.stats || []).map(st => `
                    <div class="lp-stat-box">
                        <div class="lp-stat-number">${escapeHtml(st.number || '0')}</div>
                        <div class="lp-stat-label">${escapeHtml(st.label_ar || '')}</div>
                    </div>
                `).join('');
                return `
                    <section class="lp-section">
                        <h2 class="lp-section-title">${escapeHtml(blk.title_ar || 'أرقام وإنجازات مثبتة')}</h2>
                        ${blk.subtitle_ar ? `<p class="lp-section-subtitle">${escapeHtml(blk.subtitle_ar)}</p>` : ''}
                        <div class="lp-grid-4">${statsHtml}</div>
                    </section>
                `;
            }

            if (type === 'testimonials') {
                const itemsHtml = (blk.items || []).map(tm => `
                    <div class="lp-card">
                        <div style="color:#D4AF37; margin-bottom:10px; font-size:1.1rem;">${'⭐'.repeat(tm.stars || 5)}</div>
                        <p class="lp-card-desc" style="font-style:italic; margin-bottom:1rem;">"${escapeHtml(tm.quote_ar || '')}"</p>
                        <div style="font-weight:800; color:#FFF; font-size:0.95rem;">${escapeHtml(tm.name_ar || '')}</div>
                        <div style="font-size:0.82rem; color:#94A3B8;">${escapeHtml(tm.role_ar || '')}</div>
                    </div>
                `).join('');
                return `
                    <section class="lp-section">
                        <h2 class="lp-section-title">${escapeHtml(blk.title_ar || 'آراء وشهادات العملاء')}</h2>
                        ${blk.subtitle_ar ? `<p class="lp-section-subtitle">${escapeHtml(blk.subtitle_ar)}</p>` : ''}
                        <div class="lp-grid-3">${itemsHtml}</div>
                    </section>
                `;
            }

            if (type === 'guarantee') {
                return `
                    <section class="lp-section">
                        <div class="lp-guarantee-box">
                            <div style="font-size: 3rem; margin-bottom: 0.5rem;">🛡️</div>
                            <h2 class="lp-section-title" style="color:#D4AF37 !important; margin-bottom:0.8rem;">${escapeHtml(blk.title_ar || 'الضمان الذهبي')}</h2>
                            <p class="lp-card-desc" style="font-size:1.05rem; color:#CBD5E1; max-width:700px; margin:0 auto;">${escapeHtml(blk.subtitle_ar || '')}</p>
                        </div>
                    </section>
                `;
            }

            if (type === 'pricing') {
                const listHtml = (blk.features || []).map(f => `<li>${escapeHtml(f)}</li>`).join('');
                return `
                    <section class="lp-section" id="pricing_section">
                        <h2 class="lp-section-title">${escapeHtml(blk.title_ar || 'باقة الاستثمار')}</h2>
                        ${blk.subtitle_ar ? `<p class="lp-section-subtitle">${escapeHtml(blk.subtitle_ar)}</p>` : ''}
                        <div class="lp-pricing-card">
                            ${blk.discount_badge_ar ? `<div class="lp-discount-badge">${escapeHtml(blk.discount_badge_ar)}</div>` : ''}
                            <h3 style="color:#FFF !important; font-size:1.4rem !important; font-weight:800 !important;">${escapeHtml(blk.package_name_ar || 'الباقة القيادية')}</h3>
                            <div class="lp-price-amount">
                                ${escapeHtml(blk.price_ar || '')}
                                ${blk.original_price_ar ? `<span class="lp-price-original">${escapeHtml(blk.original_price_ar)}</span>` : ''}
                            </div>
                            <ul class="lp-feature-list">${listHtml}</ul>
                            <a href="${blk.cta_link || '#faq_cta_section'}" class="lp-btn-primary" style="width:100%; justify-content:center;">${escapeHtml(blk.cta_text_ar || '💳 اشترك الآن')}</a>
                        </div>
                    </section>
                `;
            }

            if (type === 'faq_cta') {
                const faqsHtml = (blk.faqs || []).map(f => `
                    <div class="lp-faq-item">
                        <div class="lp-faq-q">❓ ${escapeHtml(f.q_ar)}</div>
                        <div class="lp-faq-a">${escapeHtml(f.a_ar)}</div>
                    </div>
                `).join('');
                return `
                    <section class="lp-section" id="faq_cta_section">
                        <h2 class="lp-section-title">${escapeHtml(blk.title_ar || 'الأسئلة الشائعة')}</h2>
                        ${blk.subtitle_ar ? `<p class="lp-section-subtitle">${escapeHtml(blk.subtitle_ar)}</p>` : ''}
                        <div style="max-width:750px; margin:0 auto 3rem auto;">${faqsHtml}</div>
                        ${blk.final_cta_title_ar ? `
                            <div class="lp-final-cta-banner">
                                <h2 style="color:#FFF !important; font-size:1.8rem !important; margin-bottom:1.2rem;">${escapeHtml(blk.final_cta_title_ar)}</h2>
                                <a href="${blk.whatsapp_url || 'https://wa.me/966500000000'}" target="_blank" class="lp-btn-primary" style="font-size:1.1rem; padding:16px 36px;">
                                    ${escapeHtml(blk.final_cta_btn_ar || '📲 تواصل معنا الآن')}
                                </a>
                            </div>
                        ` : ''}
                    </section>
                `;
            }

            return '';
        }
    </script>
</body>
</html>
